name: Build latest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-note-latest-apk
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the fixed signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.MASTERNOTE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/MasterNote.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "MASTERNOTE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Allocate a monotonic app version
        run: |
          COMMIT_UNIX="$(git show -s --format=%ct "$GITHUB_SHA")"
          VERSION_CODE="$((COMMIT_UNIX / 60))"
          VERSION_NAME="$(date -u -d "@$COMMIT_UNIX" +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          test "$VERSION_CODE" -gt 10009
          echo "MASTERNOTE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "MASTERNOTE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Release version: $VERSION_NAME ($VERSION_CODE)"

      - name: Require a version newer than the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_APK="$RUNNER_TEMP/previous-MasterNote.apk"
          if gh release download dev-latest --pattern MasterNote.apk --output "$PREVIOUS_APK" --repo "$GITHUB_REPOSITORY"; then
            PREVIOUS_VERSION_CODE="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$PREVIOUS_APK" | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
            if [[ ! "$MASTERNOTE_VERSION_CODE" =~ ^[0-9]+$ || ! "$PREVIOUS_VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not compare APK version codes (new='$MASTERNOTE_VERSION_CODE', published='$PREVIOUS_VERSION_CODE')."
              exit 1
            fi
            echo "Published version code: $PREVIOUS_VERSION_CODE"
            if (( 10#$MASTERNOTE_VERSION_CODE <= 10#$PREVIOUS_VERSION_CODE )); then
              echo "::error::Refusing to publish version $MASTERNOTE_VERSION_CODE over newer-or-equal version $PREVIOUS_VERSION_CODE."
              exit 1
            fi
          else
            echo "No previous APK release; accepting the first fixed-signature build."
          fi

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease testDebugUnitTest

      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: d511edca8bcc955e687df75a51e4c741f7636a612238e508d209b0fc1f162983
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          ACTUAL_CERT_SHA256="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_PATH" | awk -F': ' '/SHA-256 digest/ {print $2; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"
          APK_BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH")"
          ACTUAL_PACKAGE="$(printf '%s\n' "$APK_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$APK_BADGING" | sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
          echo "Signing certificate SHA-256: $ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          test "$ACTUAL_PACKAGE" = "com.studyink.app"
          test "$ACTUAL_VERSION_CODE" = "$MASTERNOTE_VERSION_CODE"
          cp "$APK_PATH" "$RUNNER_TEMP/MasterNote.apk"

      - name: Publish the stable APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev-latest "$GITHUB_SHA"
          git push --force origin refs/tags/dev-latest
          RELEASE_NOTES="Automatically built from main commit ${GITHUB_SHA}. Version ${MASTERNOTE_VERSION_NAME} (${MASTERNOTE_VERSION_CODE}). Signing certificate SHA-256: d511edca8bcc955e687df75a51e4c741f7636a612238e508d209b0fc1f162983"
          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev-latest "$RUNNER_TEMP/MasterNote.apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit dev-latest --title "MasterNote latest test APK" --notes "$RELEASE_NOTES" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create dev-latest "$RUNNER_TEMP/MasterNote.apk" --title "MasterNote latest test APK" --notes "$RELEASE_NOTES" --latest --repo "$GITHUB_REPOSITORY"
          fi
