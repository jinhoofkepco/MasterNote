name: Package format

on:
  pull_request:
    paths: ["package-format/**", ".github/workflows/package-format.yml"]
  workflow_dispatch:

jobs:
  codec-validator-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -p package-format test :cli:installDist
