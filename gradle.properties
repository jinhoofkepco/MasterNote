org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Connected tests must never uninstall the app afterwards: uninstalling deletes the real
# library (PDF copies and every handwriting log) on the tutoring devices. 2026-08-23 this
# exact wipe happened on both devices; instrumentation runs belong on an emulator anyway.
android.injected.androidTest.leaveApksInstalledAfterTest=true
